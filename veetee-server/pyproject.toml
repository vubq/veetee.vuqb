[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "veetee-server"
version = "0.1.0"
description = "Veetee realtime voice data plane"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.9,<4",
  "httpx>=0.27,<1",
  "opuslib>=3.0,<4",
  "cryptography>=42,<47",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "soxr>=0.3,<2"]
local-tts = ["vieneu>=3.2.4,<4", "soxr>=0.3,<2"]
local-asr = ["faster-whisper>=1.2.1,<2"]
local-asr-cuda = [
  "faster-whisper>=1.2.1,<2",
  "nvidia-cublas-cu12>=12,<13",
  "nvidia-cuda-nvrtc-cu12>=12,<13",
  "nvidia-cudnn-cu12>=9,<10",
]
local-vad = ["onnxruntime>=1.18,<2", "numpy>=1.26,<3"]
mqtt = ["aiomqtt>=2.5,<3"]

[project.scripts]
veetee-server = "veetee_server.main:main"

[project.entry-points."veetee.providers"]
"veetee.vad.energy" = "veetee_server.providers:energy_vad_factory"
"veetee.vad.silero" = "veetee_server.providers:silero_vad_factory"
"veetee.asr.fixture" = "veetee_server.providers:fixture_asr_factory"
"veetee.asr.phowhisper" = "veetee_server.providers:phowhisper_asr_factory"
"veetee.llm.fixture" = "veetee_server.providers:fixture_llm_factory"
"groq.chat" = "veetee_server.providers:groq_llm_factory"
"veetee.tts.fixture-tone" = "veetee_server.providers:fixture_tone_tts_factory"
"vieneu.v3-turbo" = "veetee_server.providers:vieneu_tts_factory"
"veetee.intent.patterns" = "veetee_server.providers:pattern_intent_factory"
"veetee.memory.session-window" = "veetee_server.providers:session_window_memory_factory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
