<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7fafc" />
    <meta
      name="description"
      content="Veetee Manager Web — giao diện xem trước để quản lý trợ lý và thiết bị."
    />
    <title>Veetee Manager</title>
  </head>
  <body>
    <div id="app">
      <!-- Kept inline so a hard reload has a stable shell before Vue, fonts and
           the lazy route chunk are ready. Vue replaces this node on mount. -->
      <div class="app-boot-shell" role="status" aria-live="polite">
        <div class="app-boot-nav">
          <span class="app-boot-brand"><span class="app-boot-mark">V</span><strong>Veetee</strong></span>
          <span class="app-boot-nav-item">Trợ lý</span>
          <span class="app-boot-nav-item">Dịch vụ AI</span>
        </div>
        <main class="app-boot-content">
          <span class="app-boot-kicker">Đang mở không gian quản trị</span>
          <span class="app-boot-title"></span>
          <span class="app-boot-line app-boot-line-wide"></span>
          <span class="app-boot-line"></span>
          <div class="app-boot-grid">
            <span></span><span></span><span></span>
          </div>
        </main>
      </div>
    </div>
    <style>
      :root { color-scheme: light; }
      .app-boot-shell { min-height: 100dvh; background: #f7fafc; color: #1f2937; font: 14px/1.5 "Segoe UI", sans-serif; }
      .app-boot-nav { display: flex; height: 58px; align-items: center; gap: 24px; border-bottom: 1px solid #d5dfe9; background: #fff; padding: 0 max(12px, calc((100% - 1120px) / 2)); }
      .app-boot-brand { display: inline-flex; align-items: center; gap: 9px; font-size: 14px; }
      .app-boot-mark { display: inline-grid; width: 30px; height: 30px; place-items: center; border: 1px solid #bfd2ff; border-radius: 8px; background: #edf3ff; color: #2b63ee; font-weight: 700; }
      .app-boot-nav-item { color: #667085; font-size: 11px; }
      .app-boot-content { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 32px 0 48px; }
      .app-boot-kicker { display: block; margin-bottom: 12px; color: #2b63ee; font-size: 10px; font-weight: 700; text-transform: uppercase; }
      .app-boot-title { display: block; width: min(260px, 70%); height: 25px; border-radius: 5px; background: #e8eef4; }
      .app-boot-line { display: block; width: min(520px, 88%); height: 10px; margin-top: 12px; border-radius: 4px; background: #e8eef4; }
      .app-boot-line-wide { width: min(680px, 100%); margin-top: 18px; }
      .app-boot-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
      .app-boot-grid span { display: block; min-height: 118px; border: 1px solid #d5dfe9; border-radius: 10px; background: #fff; }
      @media (max-width: 640px) {
        .app-boot-nav-item { display: none; }
        .app-boot-content { width: calc(100% - 24px); padding-top: 20px; }
        .app-boot-grid { grid-template-columns: 1fr; }
        .app-boot-grid span { min-height: 86px; }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
